<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Modelo de Caixa</title>

    <style>
        h1 {
            background-color: lightgray;
            height: 300px;
            width: 300px;

            /* border simplificado EX: border: 10px solid darkslategrey; 
            border-top: 10px;
            border-style: solid;
            border-color: darkslategrey; */

            border:10px solid darkslategrey;
           
            /* padding simplificado EX: padding: 10px (uma vez vale para os quatros cantos)
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px; */

             padding: 10px; 
           
             /* margin simplificado EX: margin:10px (uma vez vale para os quatros cantos)
              margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;*/

            margin:10px;

           

            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;
        /*simplificando*/

        }

        a {
            border-width: 10px;
            border-style: dashed;
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafo também são exemplos de box-level,mas os <a href="#">links são exemplos de caixa inline-level </a>Vamos ver como tudo isso funciona</p>
    . 
</body>
</html>
