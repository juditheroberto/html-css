<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>
    <h1>Reproduzindo Àudio</h1>
    <p>Vamos aprender a reproduzir áudios em html5</p>
    <p>Barraca do Pedrão</p>
    <audio src="midia/(CD 1999) DJ Celso - Flash Back do Pedrão Vol.02 (720p).mp3"controls autoplay></audio>
    <!--formatos MP3-WAV-OGG-->
    <p>Uma segunda opção</p>
    <p>Barraca do Pedrão</p>
    <audio preload="auto" autoplay controls>
        <source src="midia/(CD 2000) DJ Celso - Flash Back do Pedrão Vol.03 (720p).mp3" type="audio/mpeg">
        <source src="midia/(CD 1999) DJ Celso - Flash Back do Pedrão Vol.02 (720p).ogg" type="audio/ogg">
        <source src="midia/(CD 2000) DJ Celso - Flash Back do Pedrão Vol.03 (720p).wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/(CD 2000) DJ Celso - Flash Back do Pedrão Vol.03 (720p).mp3">clique aqui para baixar o arquivo mp3</a></p>

    </audio>



    
</body>
</html>
